name: CI

# MindMeter CI/CD pipeline
# - PRs and pushes to `Development` and `main` run lint + tests
# - Path filters skip jobs when the relevant folder didn't change
# - Deploys are not done here: Vercel (frontend) and Railway (backend) deploy
#   from their own GitHub integrations. Hosting choice: docs/ARCHITECTURE.md.

on:
  pull_request:
    branches: [main, Development]
  push:
    branches: [main, Development]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'shared/**'
              - '.github/workflows/**'

  lint-frontend:
    name: Frontend lint + build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (includes the TypeScript check against shared/contract.ts)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  lint-backend:
    name: Backend lint + test
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindmeter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Unit + integration tests (real PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mindmeter_test
